<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор РОВ</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f4f7f9; }
        .app-container { display: grid; grid-template-columns: 320px 1fr 320px; gap: 30px; align-items: flex-start; max-width: 1600px; margin: 0 auto; }
        .sidebar { position: sticky; top: 20px; max-height: 90vh; overflow-y: auto; }
        .main-content { min-width: 600px; max-width: 800px; justify-self: center; width: 100%; }
        .right-spacer { width: 320px; } /* Пустая колонка для центровки */
        
        .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .stage { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-left: 4px solid #007bff; }
        .history-item { background: #e9ecef; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; flex-direction: column; }
        .history-item-info { margin-bottom: 5px; }
        .history-item-actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .history-item-actions button { padding: 5px 10px; font-size: 0.85em; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        .label-inline { display: inline-block; margin-right: 10px; }
        .label-inline input { width: auto; display: inline-block; }
        .label-inline select { width: auto; display: inline-block; }

        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 10px; padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 3px; }
        .error { border-color: red; }
        .error-msg { color: red; font-size: 0.9em; }
        h1, h2 { color: #333; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>История</h2>
            <div class="section" id="history_section">
                <div id="history_list">Загрузка истории...</div>
            </div>
        </aside>

        <main class="main-content">
            <h1>Генерация РОВ</h1>
            
            <div class="section">
                <label>№ релиза</label>
                <input type="text" id="release_number" required>
                
                <label>Дата и время начала (дд.мм.гг ЧЧ:ММ)</label>
                <input type="text" id="start_date_time" placeholder="18.05.26 23:00">

                <label>АС</label>
                <select id="as_system" onchange="updateFP()"></select>

                <label>ФП</label>
                <select id="fp_system"></select>
            </div>

            <div class="section">
                <label>Ответственный</label>
                <input type="text" id="responsible" value="Иванов И.И.">
                <label>Контакты</label>
                <input type="text" id="contacts" value="+7-999-000-00-00">
                <label>Описание</label>
                <textarea id="description">Плановые работы</textarea>
                <label>Возможная недоступность</label>
                <textarea id="possible_downtime">Обновление системы</textarea>
            </div>

            <div class="section">
                <h3>План работ</h3>
                <div id="stages_list"></div>
                <button type="button" onclick="addStage('stages_list')">+ Добавить этап работы</button>
            </div>

            <div class="section">
                <h3>План отката</h3>
                <div id="rollback_list"></div>
                <button type="button" onclick="addStage('rollback_list')">+ Добавить этап отката</button>
            </div>

            <button onclick="generateDocx()" style="background: #28a745; width: 100%; font-size: 1.2em; margin-bottom: 10px;">Сгенерировать DOCX + Письмо</button>
            <button onclick="generateEmailOnly()" style="background: #17a2b8; width: 100%; font-size: 1.1em; margin-bottom: 50px;">Только Письмо (без сохранения)</button>
        </main>

        <div class="right-spacer"></div>
    </div>

    <script>
        let config = {};

        // Загрузка конфигурации с сервера
        async function loadConfig() {
            try {
                const res = await fetch('/config');
                if (!res.ok) throw new Error("Не удалось загрузить конфигурацию сервера");
                
                config = await res.json();
                
                document.getElementById('release_number').placeholder = config.release_placeholder || "";
                const asSelect = document.getElementById('as_system');
                asSelect.innerHTML = '';
                config.as_list.forEach(as => {
                    let opt = document.createElement('option');
                    opt.value = as; opt.textContent = as;
                    asSelect.appendChild(opt);
                });
                updateFP();
                await loadHistory(); // Загружаем историю после загрузки конфига
            } catch (e) {
                console.error("Ошибка загрузки конфига:", e);
            }
        }
        

        function updateFP() {
            const asVal = document.getElementById('as_system').value;
            const fpSelect = document.getElementById('fp_system');
            fpSelect.innerHTML = '';
            const fps = config.fp_mapping[asVal] || [];
            fps.forEach(fp => {
                let opt = document.createElement('option');
                opt.value = fp; opt.textContent = fp;
                fpSelect.appendChild(opt);
            });
        }

        // Добавление нового этапа (работы или отката)
        function addStage(containerId, stageData = { description: '', duration_raw: '', comment: '' }) {
            const div = document.createElement('div');
            div.className = 'stage';
            div.innerHTML = `
                <label>Описание работ</label>
                <input type="text" class="s-desc" value="${stageData.description}" required>
                <label>Длительность (например: 1 час, 30 мин)</label>
                <input type="text" class="s-dur" value="${stageData.duration_raw}" placeholder="60 мин" required>
                <label>Комментарий</label>
                <input type="text" class="s-comm" value="${stageData.comment}">
                <button onclick="this.parentElement.remove()" style="background:red">Удалить</button>
            `;
            document.getElementById(containerId).appendChild(div);
        }

        // Очистка списка этапов
        function clearStages(containerId) {
            document.getElementById(containerId).innerHTML = '';
        }

        // Загрузка истории генераций
        async function loadHistory() {
            const historyListDiv = document.getElementById('history_list');
            historyListDiv.innerHTML = 'Загрузка истории...';
            try {
                const response = await fetch('/history');
                if (!response.ok) throw new Error("Не удалось загрузить историю");
                const history = await response.json();

                historyListDiv.innerHTML = ''; // Очищаем "Загрузка истории..."
                if (history.length === 0) {
                    historyListDiv.innerHTML = 'История пуста.';
                    return;
                }

                history.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'history-item';
                    const timestamp = new Date(item.timestamp).toLocaleString('ru-RU');
                    itemDiv.innerHTML = `
                        <div class="history-item-info">
                            <strong>${item.release_number}</strong> (${item.as_system} / ${item.fp_system})<br>
                            <small>${timestamp}</small>
                        </div>
                        <div class="history-item-actions">
                            <button onclick="downloadHistoryItem('${item.disk_filename}', '${encodeURIComponent(item.generated_filename)}')">DOCX</button>
                            ${item.email_disk_filename ? 
                                `<button onclick="downloadHistoryItem('${item.email_disk_filename}', '${encodeURIComponent(item.email_generated_filename)}')" style="background: #6c757d;">
                                    EML
                                 </button>` : 
                                ''}
                            <button onclick="loadHistoryItemToForm('${item.id}')">Загрузить в форму</button>
                            <button onclick="deleteHistoryItem('${item.id}')" style="background: #dc3545;">Удалить</button>
                        </div>
                    `;
                    historyListDiv.appendChild(itemDiv);
                });

            } catch (e) {
                console.error("Ошибка загрузки истории:", e);
                historyListDiv.innerHTML = `Ошибка загрузки истории: ${e.message}`;
            }
        }

        // Удаление записи
        async function deleteHistoryItem(itemId) {
            if (!confirm("Вы уверены, что хотите удалить эту запись и файл с сервера?")) return;
            try {
                const response = await fetch(`/history/${itemId}`, { method: 'DELETE' });
                if (!response.ok) throw new Error("Ошибка при удалении");
                
                // Перезагружаем список
                await loadHistory();
            } catch (e) {
                alert("Не удалось удалить: " + e.message);
            }
        }

        // Скачивание файла из истории
        function downloadHistoryItem(diskFilename, encodedGeneratedFilename) {
            const url = `/download/${diskFilename}?pretty_name=${encodedGeneratedFilename}`;
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = decodeURIComponent(encodedGeneratedFilename); // Имя файла для сохранения
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        // Загрузка данных из истории в форму
        async function loadHistoryItemToForm(itemId) {
            try {
                const response = await fetch(`/history/${itemId}`);
                if (!response.ok) throw new Error("Не удалось загрузить данные истории");
                const data = await response.json();

                // Заполняем основные поля
                document.getElementById('release_number').value = data.release_number;
                document.getElementById('start_date_time').value = data.start_date_time;
                document.getElementById('responsible').value = data.responsible;
                document.getElementById('contacts').value = data.contacts;
                document.getElementById('description').value = data.description;
                document.getElementById('possible_downtime').value = data.possible_downtime;

                // Заполняем АС и ФП
                document.getElementById('as_system').value = data.as_system;
                updateFP(); // Обновляем список ФП на основе выбранной АС
                document.getElementById('fp_system').value = data.fp_system;

                // Заполняем этапы работ
                clearStages('stages_list');
                data.stages.forEach(stage => addStage('stages_list', stage));
                clearStages('rollback_list');
                data.rollback_stages.forEach(stage => addStage('rollback_list', stage));

            } catch (e) {
                alert("Ошибка загрузки данных в форму: " + e.message);
            }
        }

        // Сбор данных из формы
        function getFormData() {
            const collect = (id) => Array.from(document.getElementById(id).querySelectorAll('.stage')).map(s => ({
                description: s.querySelector('.s-desc').value,
                duration_raw: s.querySelector('.s-dur').value,
                comment: s.querySelector('.s-comm').value
            }));
            return {
                release_number: document.getElementById('release_number').value,
                start_date_time: document.getElementById('start_date_time').value,
                as_system: document.getElementById('as_system').value,
                fp_system: document.getElementById('fp_system').value,
                responsible: document.getElementById('responsible').value,
                contacts: document.getElementById('contacts').value,
                description: document.getElementById('description').value,
                possible_downtime: document.getElementById('possible_downtime').value,
                stages: collect('stages_list'),
                rollback_stages: collect('rollback_list')
            };
        }

        async function generateDocx() {
            const data = getFormData();

            if (!data.release_number || !data.start_date_time || data.stages.length === 0) {
                alert("Заполните обязательные поля и добавьте хотя бы один этап");
                return;
            }

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    let msg = "Ошибка сервера";
                    // Проверяем, является ли ответ JSON-ом (ошибка FastAPI)
                    if (response.headers.get('content-type')?.includes('application/json')) {
                        try {
                            const errJson = JSON.parse(errText);
                            msg = errJson.detail || msg;
                        } catch(e) { 
                            msg = errText;
                        }
                    } else {
                        msg = errText;
                    }
                    throw new Error(msg);
                }

                const blob = await response.blob();
                if (blob.size === 0) throw new Error("Получен пустой файл");

                // Извлекаем имя файла из заголовков
                let filename = "document.docx";
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.includes("filename*=utf-8''")) {
                    filename = decodeURIComponent(disposition.split("filename*=utf-8''")[1]);
                }

                // Создаем ссылку и инициируем загрузку
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                // Освобождаем память через 10 секунд
                // Теперь это не так критично, так как файл остается на сервере, но хорошая практика
                setTimeout(() => {
                    window.URL.revokeObjectURL(url);
                    a.remove();
                }, 10000);

            } catch (e) {
                alert("Ошибка: " + e.message);
            } finally {
                await loadHistory(); // Обновляем историю после успешной генерации
            }
        }

        async function generateEmailOnly() {
            const data = getFormData();
            if (!data.release_number) return alert("Введите номер релиза");

            try {
                const response = await fetch('/generate-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error(await response.text());

                const blob = await response.blob();
                let filename = "email.eml";
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.includes("filename*=utf-8''")) {
                    filename = decodeURIComponent(disposition.split("filename*=utf-8''")[1]);
                }

                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    window.URL.revokeObjectURL(url);
                    a.remove();
                }, 5000);

            } catch (e) {
                alert("Ошибка при генерации письма: " + e.message);
            }
        }

        loadConfig();
        addStage('stages_list');
        addStage('rollback_list');
    </script>
</body>
</html>
