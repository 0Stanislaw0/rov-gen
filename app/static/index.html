<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор РОВ</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .stage { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-left: 4px solid #007bff; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 10px; padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 3px; }
        .error { border-color: red; }
        .error-msg { color: red; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Генерация РОВ</h1>
    
    <div class="section">
        <label>№ релиза</label>
        <input type="text" id="release_number" required>
        
        <label>Дата и время начала (дд.мм.гг ЧЧ:ММ)</label>
        <input type="text" id="start_date_time" placeholder="18.05.26 23:00">

        <label>АС</label>
        <select id="as_system" onchange="updateFP()"></select>

        <label>ФП</label>
        <select id="fp_system"></select>
    </div>

    <div class="section">
        <label>Ответственный</label>
        <input type="text" id="responsible" value="Иванов И.И.">
        <label>Контакты</label>
        <input type="text" id="contacts" value="+7-999-000-00-00">
        <label>Описание</label>
        <textarea id="description">Плановые работы</textarea>
        <label>Возможная недоступность</label>
        <textarea id="possible_downtime">Обновление системы</textarea>
    </div>

    <div class="section">
        <h3>План работ</h3>
        <div id="stages_list"></div>
        <button type="button" onclick="addStage('stages_list')">+ Добавить этап работы</button>
    </div>

    <div class="section">
        <h3>План отката</h3>
        <div id="rollback_list"></div>
        <button type="button" onclick="addStage('rollback_list')">+ Добавить этап отката</button>
    </div>

    <button onclick="generateDocx()" style="background: green; width: 100%; font-size: 1.2em;">Сгенерировать DOCX</button>

    <script>
        let config = {};

        async function loadConfig() {
            try {
                const res = await fetch('/config');
                if (!res.ok) throw new Error("Не удалось загрузить конфигурацию сервера");
                
                config = await res.json();
                
                document.getElementById('release_number').placeholder = config.release_placeholder || "";
                const asSelect = document.getElementById('as_system');
                asSelect.innerHTML = '';
                config.as_list.forEach(as => {
                    let opt = document.createElement('option');
                    opt.value = as; opt.textContent = as;
                    asSelect.appendChild(opt);
                });
                updateFP();
            } catch (e) {
                console.error("Ошибка загрузки конфига:", e);
            }
        }

        function updateFP() {
            const asVal = document.getElementById('as_system').value;
            const fpSelect = document.getElementById('fp_system');
            fpSelect.innerHTML = '';
            const fps = config.fp_mapping[asVal] || [];
            fps.forEach(fp => {
                let opt = document.createElement('option');
                opt.value = fp; opt.textContent = fp;
                fpSelect.appendChild(opt);
            });
        }

        function addStage(containerId) {
            const div = document.createElement('div');
            div.className = 'stage';
            div.innerHTML = `
                <label>Описание работ</label>
                <input type="text" class="s-desc" required>
                <label>Длительность (например: 1 час, 30 мин)</label>
                <input type="text" class="s-dur" placeholder="60 мин" required>
                <label>Комментарий</label>
                <input type="text" class="s-comm">
                <button onclick="this.parentElement.remove()" style="background:red">Удалить</button>
            `;
            document.getElementById(containerId).appendChild(div);
        }

        async function generateDocx() {
            const collectStages = (containerId) => {
                const items = [];
                document.getElementById(containerId).querySelectorAll('.stage').forEach(s => {
                    items.push({
                        description: s.querySelector('.s-desc').value,
                        duration_raw: s.querySelector('.s-dur').value,
                        comment: s.querySelector('.s-comm').value
                    });
                });
                return items;
            };

            const data = {
                release_number: document.getElementById('release_number').value,
                start_date_time: document.getElementById('start_date_time').value,
                as_system: document.getElementById('as_system').value,
                fp_system: document.getElementById('fp_system').value,
                responsible: document.getElementById('responsible').value,
                contacts: document.getElementById('contacts').value,
                description: document.getElementById('description').value,
                possible_downtime: document.getElementById('possible_downtime').value,
                stages: collectStages('stages_list'),
                rollback_stages: collectStages('rollback_list')
            };

            if (!data.release_number || !data.start_date_time || data.stages.length === 0) {
                alert("Заполните обязательные поля и добавьте хотя бы один этап");
                return;
            }

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    let msg = "Ошибка сервера";
                    // Проверяем, является ли ответ JSON-ом (ошибка FastAPI)
                    if (response.headers.get('content-type')?.includes('application/json')) {
                        try {
                            const errJson = JSON.parse(errText);
                            msg = errJson.detail || msg;
                        } catch(e) { 
                            msg = errText;
                        }
                    } else {
                        msg = errText;
                    }
                    throw new Error(msg);
                }

                const blob = await response.blob();
                if (blob.size === 0) throw new Error("Получен пустой файл");

                // Извлекаем имя файла из заголовков
                let filename = "document.docx";
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.includes("filename*=utf-8''")) {
                    filename = decodeURIComponent(disposition.split("filename*=utf-8''")[1]);
                }

                // Создаем ссылку и инициируем загрузку
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                // Освобождаем память через 10 секунд
                setTimeout(() => {
                    window.URL.revokeObjectURL(url);
                    a.remove();
                }, 10000);

            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        loadConfig();
        addStage('stages_list');
        addStage('rollback_list');
    </script>
</body>
</html>
